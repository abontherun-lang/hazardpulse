<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HazardPulse</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container">
    <header id="header">
      <div id="header-left">
        <div id="header-title">
          <h1>HazardPulse</h1>
          <span id="last-update"></span>
        </div>
        <span class="header-sep"></span>
        <div id="status">
          <div id="status-toggle" onclick="toggleStatusPanel()">
            <span id="alert-count">Loading...</span>
            <span class="status-arrow">&#9660;</span>
          </div>
          <div id="status-panel" class="hidden">
            <input type="text" id="status-search" placeholder="Filter categories..." autocomplete="off">
            <div id="status-list"></div>
          </div>
        </div>
        <span class="header-sep"></span>
        <div id="weather-wrap">
          <button id="weather-btn" onclick="toggleWeather()" title="Local weather">--°F</button>
          <div id="weather-panel" class="weather-panel hidden">
            <div id="weather-content"></div>
          </div>
        </div>
      </div>
      <div id="header-controls">
        <button id="refresh-btn" onclick="refreshAlerts()" aria-label="Refresh" title="Refresh">&#x21bb;<span class="btn-label"> Refresh</span></button>
        <button onclick="centerOnUS()" aria-label="Center map on US" title="Center on US">&#x2316;<span class="btn-label"> Center US</span></button>
        <button id="toggle-panel-btn" onclick="togglePanel()" aria-label="Toggle layers panel" title="Layers">&#x2630;<span class="btn-label"> Layers</span></button>
      </div>
    </header>

    <div id="map"></div>

    <!-- Layer panel -->
    <div id="legend" autocomplete="off">
      <div class="legend-title-row">
        <h3>Layers</h3>
        <button class="panel-close-btn" onclick="togglePanel()" title="Minimize panel">&#x2715;</button>
      </div>

      <!-- Time Filter -->
      <div class="time-filter">
        <div class="time-filter-header">
          <span class="group-label">Time Filter</span>
        </div>
        <div class="time-slider-row">
          <span class="time-bound">Oldest</span>
          <input type="range" id="time-slider" aria-label="Time filter"
                 oninput="onTimeSliderChange(this.value)">
          <span class="time-bound">Now</span>
        </div>
        <div id="time-label" class="time-label-text">Showing all events</div>
      </div>

      <!-- Presets -->
      <div class="preset-bar-label">Quick Views</div>
      <div class="preset-bar">
        <button onclick="applyPreset('all')" title="Show all layers">&#x25C9; All</button>
        <button onclick="applyPreset('critical')" title="Critical events only">&#x26A0; Critical</button>
        <button onclick="applyPreset('weather')" title="Weather + tropical">&#x26C8; Weather</button>
        <button onclick="applyPreset('seismic')" title="Earthquakes + tsunami">&#x25CE; Seismic</button>
        <button onclick="applyPreset('fire')" title="Wildfires + fire warnings">&#x2668; Fire</button>
        <button onclick="applyPreset('conflict')" title="Violence + unrest">&#x2694; Conflict</button>
      </div>

      <!-- Data layers: generated from /api/layers by renderLegend() in app.js -->
      <div id="legend-groups"></div>

      <!-- Satellite & Radar -->
      <div class="legend-section">
        <div class="legend-group-header" onclick="toggleCollapse('satellite')">
          <span class="collapse-arrow" data-group="satellite">&#9660;</span>
          <span class="group-label">Satellite & Radar</span>
        </div>
        <div class="legend-body" data-group="satellite">
          <label class="legend-item"><input type="checkbox" onchange="syncSatelliteVisibility()" data-sat="sat-ir"><span class="legend-color legend-gradient" style="background:linear-gradient(135deg,#1a1a2e,#4a4a6a);"></span>Infrared</label>
          <label class="legend-item"><input type="checkbox" onchange="syncSatelliteVisibility()" data-sat="sat-vis"><span class="legend-color legend-gradient" style="background:linear-gradient(135deg,#666,#ddd);"></span>Visible</label>
          <label class="legend-item"><input type="checkbox" onchange="syncSatelliteVisibility()" data-sat="sat-wv"><span class="legend-color legend-gradient" style="background:linear-gradient(135deg,#1a237e,#42a5f5);"></span>Water Vapor</label>
          <label class="legend-item"><input type="checkbox" onchange="syncSatelliteVisibility()" data-sat="radar"><span class="legend-color legend-gradient" style="background:linear-gradient(135deg,#4CAF50,#F44336);"></span>Radar</label>
          <div class="opacity-control">
            <label for="sat-opacity">Opacity</label>
            <input type="range" id="sat-opacity" min="0" max="1" step="0.05" value="0.5" aria-label="Satellite overlay opacity" oninput="setSatelliteOpacity(this.value)">
          </div>
        </div>
      </div>

      <div class="legend-source">
        NOAA/NWS | Credit: <a href="https://www.usgs.gov" target="_blank">USGS</a> |
        NASA FIRMS | FEMA |
        <a href="https://www.gdeltproject.org/" target="_blank">GDELT Project</a> |
        Iowa Environmental Mesonet, Iowa State University |
        RainViewer (optional, personal use) |
        &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
