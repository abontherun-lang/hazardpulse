# ============================================================
# HazardPulse — Docker Compose Configuration
# ============================================================
# Two containers: app (Node.js) and db (PostGIS).
# Just run: docker compose up -d
#
# First startup downloads Census TIGER/Line boundary data (~2-3 min).
# Subsequent starts are instant (data persists in pgdata volume).
#
# To customize, either:
#   1. Edit the values below directly, or
#   2. Copy .env.example to .env and set values there
#      (env file values override the defaults below)
# ============================================================

services:
  hazardpulse:
    # Prebuilt image published by CI on every merge to main. `docker compose
    # up -d` pulls it — no local build needed. Contributors and anyone
    # modifying the code: `docker compose up -d --build` builds from source
    # instead (sha-tagged images are available for pinning/rollback).
    image: ghcr.io/abontherun-lang/hazardpulse:latest
    build: .
    pull_policy: missing
    container_name: hazardpulse
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    ports:
      # ── Web UI + API ──────────────────────────────────
      # Access the map at http://localhost:3000
      # Change the left side to use a different host port:
      #   "8080:3000" → http://localhost:8080
      - "${PORT:-3000}:3000"

    environment:
      # ── Core Settings (defaults work out of the box) ──
      - PORT=3000
      - DATABASE_URL=postgresql://hazardpulse:hazardpulse@db:5432/hazardpulse
      - NODE_ENV=${NODE_ENV:-production}

      # ── NOAA Contact Info ─────────────────────────────
      # NOAA asks that you identify your app with a contact
      # email in the User-Agent header. Not strictly required,
      # but recommended if you plan to run this long-term.
      - USER_AGENT=${USER_AGENT:-(HazardPulse/1.0, your-email@example.com)}

      # ── CORS (optional) ──────────────────────────────
      # Lock down API access in production. Comma-separated
      # list of allowed origins. Leave empty to allow all.
      # Example: https://yourdomain.com,https://app.yourdomain.com
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: hazardpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hazardpulse
      POSTGRES_PASSWORD: hazardpulse
      POSTGRES_DB: hazardpulse
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=512MB
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazardpulse"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
